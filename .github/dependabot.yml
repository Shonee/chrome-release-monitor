version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      astro:
        patterns:
          - astro
          - "@astrojs/*"
      tooling:
        patterns:
          - vitest
          - typescript
          - prettier
          - pagefind
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
